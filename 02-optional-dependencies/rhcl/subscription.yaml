# Red Hat Connectivity Link is installed into openshift-operators (cluster-scoped).
# No separate Namespace or OperatorGroup is needed — it uses the global-operators OperatorGroup.
# After install, configure GatewayClass and Gateway resources (see 05-configuration/llm-d/).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
