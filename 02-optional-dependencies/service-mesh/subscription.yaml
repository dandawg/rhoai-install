# Service Mesh 3.x is installed into openshift-operators (cluster-scoped).
# No separate Namespace or OperatorGroup is needed — it uses the global-operators OperatorGroup.
# RHOAI creates the ServiceMesh CR automatically when llamastackoperator is set to Managed in the DSC.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
